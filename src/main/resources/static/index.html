<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Employee Attendance Management System</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            margin-top: 150px;
            background-color: #f4f6f8;
        }

        h1 {
            color: #333;
        }

        p {
            color: #666;
            font-size: 18px;
        }

        .button {
            display: inline-block;
            padding: 12px 25px;
            margin: 15px;
            text-decoration: none;
            color: white;
            background-color: #007bff;
            border-radius: 5px;
            font-size: 16px;
        }

        .button:hover {
            background-color: #0056b3;
        }

        .signup {
            background-color: #28a745;
        }

        .signup:hover {
            background-color: #1e7e34;
        }
    </style>
</head>

<body>

    <h1>Employee Attendance Management System</h1>

    <p>Welcome! Please sign up or sign in to manage employee attendance.</p>

    <a href="/signup" class="button signup">Sign Up</a>

    <a href="/signin" class="button">Sign In</a>

</body>
</html>
